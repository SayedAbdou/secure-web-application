<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Secure App{% endblock %}</title>
  <style>
    body { font-family: sans-serif; max-width: 720px; margin: 2rem auto; padding: 0 1rem; color: #222; }
    nav a { margin-right: 1rem; }
    .error { color: #b00020; }
    form input, form textarea { display: block; margin: .5rem 0; padding: .4rem; width: 100%; max-width: 360px; }
  </style>
</head>
<body>
  <nav>
    <a href="{{ url_for('index') }}">Home</a>
    {% if session.get('user_id') %}
      <a href="{{ url_for('dashboard') }}">Dashboard</a>
      <a href="{{ url_for('search') }}">Search</a>
      <a href="{{ url_for('profile') }}">Profile</a>
      <form method="post" action="{{ url_for('logout') }}" style="display:inline">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        <button type="submit">Logout</button>
      </form>
    {% else %}
      <a href="{{ url_for('login') }}">Login</a>
      <a href="{{ url_for('register') }}">Register</a>
    {% endif %}
  </nav>
  <hr>
  {% if error %}<p class="error">{{ error }}</p>{% endif %}
  {% block content %}{% endblock %}
</body>
</html>
